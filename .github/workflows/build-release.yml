name: Build Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decrypt keystore
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" > my-release-key.jks.enc
        echo "${{ secrets.KEYSTORE_PROPERTIES }}" > keystore.properties.enc
        openssl enc -d -aes-256-cbc -k "${{ secrets.KEYSTORE_DECRYPT_KEY }}" -in my-release-key.jks.enc -out app/my-release-key.jks
        openssl enc -d -aes-256-cbc -k "${{ secrets.KEYSTORE_DECRYPT_KEY }}" -in keystore.properties.enc -out keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
